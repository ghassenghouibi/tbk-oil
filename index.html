<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
/* Home page only: send a visitor to the version matching their browser language (first supported entry of
   navigator.languages; French otherwise). A language picked in the switcher is saved and always wins.
   Crawlers are never redirected, so each language page stays indexable. Runs before anything renders. */
(function () {
  try {
    if (location.pathname !== '/' || /bot|crawl|spider|slurp|lighthouse|headless/i.test(navigator.userAgent)) return;
    var lang = localStorage.getItem('thibica-lang');
    if (!lang) {
      var list = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || ''];
      for (var i = 0; i < list.length && !lang; i++) {
        var code = String(list[i]).slice(0, 2).toLowerCase();
        if (code === 'fr' || code === 'en' || code === 'ar') lang = code;
      }
    }
    if (lang === 'en' || lang === 'ar') location.replace('/' + lang + location.search + location.hash);
  } catch (e) { /* storage blocked: stay on the French page */ }
})();
</script>
<!--head:start  Everything up to head:end is rewritten for each language by scripts/prerender.js.
    This French copy is what `npm run dev` serves.-->
