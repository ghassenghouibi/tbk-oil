<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page introuvable · Page not found · الصفحة غير موجودة</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3ecdd;color:#1f2a1b;font-family:"Mulish","Helvetica Neue",Arial,sans-serif;padding:24px;box-sizing:border-box;text-align:center}
  main{max-width:36rem;display:grid;justify-items:center;gap:28px}
  img{width:96px;height:96px}
  .k{font-family:Georgia,serif;letter-spacing:.22em;text-transform:uppercase;font-size:.78rem;color:#b98a2e;margin:0}
  section{display:grid;gap:8px;justify-items:center}
  section + section{border-top:1px solid rgba(31,42,27,.16);padding-top:24px;width:100%}
  h1,h2{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;font-size:2rem;line-height:1.15;margin:0;color:#2f3d25}
  [lang="ar"] h2{font-family:"Amiri","Geeza Pro",serif;line-height:1.5}
  p{margin:0}
  a{display:inline-block;margin-top:6px;padding:11px 24px;border-radius:999px;background:#2f3d25;color:#fff;text-decoration:none;font-weight:700;font-size:.92rem}
  a:focus-visible{outline:2px solid #b98a2e;outline-offset:3px}
</style>
</head>
<body>
<main>
  <img src="/img/logo-192.png" alt="Logo Domaine Thibica" width="96" height="96">
  <p class="k">404</p>
  <section>
    <h1>Cette page n'existe pas</h1>
    <p>Le lien est peut-être ancien ou mal saisi.</p>
    <a href="/">Retour à l'accueil</a>
  </section>
  <section lang="en">
    <h2>This page doesn't exist</h2>
    <p>The link may be old or mistyped.</p>
    <a href="/en">Back to the home page</a>
  </section>
  <section lang="ar" dir="rtl">
    <h2>هذه الصفحة غير موجودة</h2>
    <p>ربما يكون الرابط قديمًا أو مكتوبًا بشكل خاطئ.</p>
    <a href="/ar">العودة إلى الصفحة الرئيسية</a>
  </section>
</main>
</body>
</html>
